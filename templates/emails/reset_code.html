<!doctype html>
<html>
<body style="margin:0;background:#f6f1f7;font-family:Lato,Arial,sans-serif;color:#2a1633">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:20px;padding:32px">
        <tr><td align="center" style="padding-bottom:16px">
          <img src="{{ logo }}" width="56" height="56" alt="Darlova" style="border-radius:14px">
        </td></tr>
        <tr><td style="font-size:16px;line-height:1.6">
          <p style="margin:0 0 12px">Hi {{ name }},</p>
          <p style="margin:0 0 20px">Here's your code to reset your Darlova password:</p>
          <div style="font-family:'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:10px;text-align:center;background:#fdeaf1;color:#b0124c;border-radius:14px;padding:16px 0;margin:0 0 20px">{{ code }}</div>
          <p style="margin:0 0 12px">It works for {{ minutes }} minutes.</p>
          <p style="margin:0;color:#7a6a80;font-size:14px">Didn't ask for this? Ignore this email. Your account is safe.</p>
        </td></tr>
      </table>
      <p style="color:#9b8aa1;font-size:12px;margin-top:16px">Darlova · darlova.com</p>
    </td></tr>
  </table>
</body>
</html>
