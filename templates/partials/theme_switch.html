<div class="theme-switch" role="group" aria-label="Colour theme">
  <button type="button" data-theme-set="light" aria-label="Light mode" title="Light"><i class="bi bi-sun"></i></button>
  <button type="button" data-theme-set="dark" aria-label="Dark mode" title="Dark"><i class="bi bi-moon-stars"></i></button>
  <button type="button" data-theme-set="system" aria-label="Use system theme" title="System"><i class="bi bi-display"></i></button>
</div>
