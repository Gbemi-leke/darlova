{% load static %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D81B60">
<meta name="csrf-token" content="{{ csrf_token }}">

<!-- Icons -->
<link rel="icon" type="image/png" href="{% static 'images/icons/favicon.png' %}">
<link rel="apple-touch-icon" href="{% static 'images/app/apple-touch-icon.png' %}">

<!-- Installable app: "Add to Home Screen" opens Darlova full-screen, straight to the dashboard -->
<link rel="manifest" href="{% url 'manifest' %}">
<meta name="application-name" content="Darlova">
<meta name="apple-mobile-web-app-title" content="Darlova">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Theme (runs first so the page never flashes the wrong colour) -->
<script src="{% static 'js/theme-init.js' %}"></script>
<!-- Opened from the home-screen icon? Skip the landing page and go to the dashboard. -->
<script src="{% static 'js/app-init.js' %}"></script>

<!-- Libraries -->
<link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">

<!-- Darlova shared styles -->
<link rel="stylesheet" href="{% static 'css/fonts.css' %}">
<link rel="stylesheet" href="{% static 'css/animations.css' %}">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
