{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D81B60">
  <title>Something went wrong — Darlova</title>
  <link rel="icon" type="image/png" href="{% static 'images/icons/favicon.png' %}">
  <!--
    Shown when the live site hits an unexpected error (DEBUG=False).
    Kept self-contained on purpose: no base template, no shared CSS or JS,
    so it still shows even if the part of the site that broke is the layout itself.
  -->
  <style>
    :root { --brand: #d81b60; --violet: #7c3aed; --text: #2a1633; --muted: #7a6a80; --card: rgba(255, 255, 255, .72); }
    @media (prefers-color-scheme: dark) {
      :root { --text: #f6eefa; --muted: #c7b6cf; --card: rgba(40, 22, 52, .62); }
      body { background: #160b1d !important; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: Lato, -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--text);
      background: #fbf3f8; overflow: hidden; position: relative;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; z-index: 0; animation: float 9s ease-in-out infinite; }
    .o1 { width: 420px; height: 420px; background: #f472b6; top: -140px; left: -120px; }
    .o2 { width: 460px; height: 460px; background: #a78bfa; bottom: -180px; right: -140px; animation-delay: -4s; }
    @keyframes float { 50% { transform: translate(30px, 24px) scale(1.06); } }

    .card {
      position: relative; z-index: 1; width: 100%; max-width: 480px; text-align: center; padding: 44px 32px 36px;
      border-radius: 32px; background: var(--card); border: 1px solid rgba(255, 255, 255, .45);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: 0 30px 80px rgba(80, 20, 90, .18);
      animation: rise .6s cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }

    .logo { position: relative; width: 96px; height: 96px; margin: 0 auto 26px; }
    .logo img { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 14px 40px rgba(216, 27, 96, .4); animation: beat 1.6s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(.98); } 45% { transform: scale(1.04); } }
    .crack {
      position: absolute; right: -10px; top: -10px; width: 36px; height: 36px; border-radius: 50%;
      background: #fff; color: var(--brand); display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 6px 18px rgba(0, 0, 0, .15);
    }
    .code { display: inline-block; font-weight: 800; letter-spacing: .14em; font-size: .75rem; color: var(--brand);
            background: rgba(216, 27, 96, .1); padding: 6px 12px; border-radius: 99px; margin-bottom: 14px; }
    h1 { font-family: "Playfair Display", Georgia, serif; font-size: 2rem; line-height: 1.15; margin: 0 0 12px; }
    h1 em { background: linear-gradient(135deg, var(--brand), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 28px; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      appearance: none; border: 0; cursor: pointer; text-decoration: none; font: inherit; font-weight: 700;
      padding: 13px 22px; border-radius: 16px; transition: transform .2s, box-shadow .2s;
    }
    .btn:active { transform: scale(.97); }
    .btn-brand { color: #fff; background: linear-gradient(135deg, #e91e63, var(--violet)); box-shadow: 0 10px 28px rgba(216, 27, 96, .35); }
    .btn-glass { color: var(--text); background: rgba(255, 255, 255, .5); border: 1px solid rgba(160, 120, 170, .3); }
    @media (prefers-color-scheme: dark) { .btn-glass { background: rgba(255, 255, 255, .08); } .crack { background: #2a1633; } }
    .note { margin-top: 26px; font-size: .82rem; color: var(--muted); }
    .note a { color: var(--brand); text-decoration: none; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>

  <main class="card" role="main">
    <div class="logo">
      <img src="{% static 'images/app/icon-192.png' %}" alt="Darlova">
      <span class="crack" aria-hidden="true">&#x26A1;</span>
    </div>
    <span class="code">ERROR 500</span>
    <h1>Our heart <em>skipped a beat</em></h1>
    <p>Something went wrong on our side, not yours.<br>It's been logged and we're on it. Please try again in a moment.</p>
    <div class="actions">
      <button class="btn btn-brand" onclick="location.reload()">Try again</button>
      <a class="btn btn-glass" href="/discover/">Go to Darlova</a>
    </div>
    <div class="note">Still stuck? Email <a href="mailto:hello@darlova.com">hello@darlova.com</a></div>
  </main>
</body>
</html>
